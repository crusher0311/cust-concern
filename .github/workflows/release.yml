name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Bump type (only patch supported currently)'
        required: false
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Bump version (patch)
        run: node tools/bump-version.js

      - name: Commit bumped files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json || true
          git commit -m "chore(release): bump version [skip ci]" || echo "no changes to commit"
          git push origin HEAD

      - name: Get new version
        id: get_version
        run: echo "version=$(node -p \"require('./manifest.json').version\")" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          NEW_VERSION=v${{ steps.get_version.outputs.version }}
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body: "Automated release for v${{ steps.get_version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
