name: Release

# Allow the workflow to write repository contents (required to push bumped files and tags)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Bump type (only patch supported currently)'
        required: false
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Bump version
        run: node tools/bump-version.js ${{ github.event.inputs.type }}

      - name: Commit bumped files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json || true
          git commit -m "chore(release): bump version [skip ci]" || echo "no changes to commit"
          git push origin HEAD

      - name: Get new version
        id: get_version
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          NEW_VERSION=v${{ steps.get_version.outputs.version }}
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Package extension
        run: |
          mkdir -p release
          git archive -o release/extension.zip HEAD

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body: "Automated release for v${{ steps.get_version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/extension.zip
          asset_name: extension-v${{ steps.get_version.outputs.version }}.zip
          asset_content_type: application/zip
